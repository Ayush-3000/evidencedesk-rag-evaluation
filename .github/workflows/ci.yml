name: Verify EvidenceDesk
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [embedded, postgres]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: evidence
          POSTGRES_USER: evidence
          POSTGRES_PASSWORD: ci-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evidence -d evidence"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      EVIDENCE_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://evidence:ci-test-only@127.0.0.1:5432/evidence' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: python -m ruff check evidencedesk scripts tests
      - run: pnpm format:check && pnpm build
      - run: python -m pytest -q --junitxml=runtime/test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-${{ matrix.database }}
          path: runtime/test-results.xml
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx
      - run: python scripts/create_compose_env.py
      - run: docker compose build
      - run: EVIDENCE_EMBEDDINGS=hash docker compose up -d --wait
      - run: python scripts/smoke_demo.py
      - run: docker compose logs --tail=50
        if: failure()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-evaluation
          path: docs/validation/evaluation.json
      - run: docker compose down
        if: always()
