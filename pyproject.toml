[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencedesk"
version = "0.1.0"
description = "Evidence-backed document answers, human review and measurable evaluation"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "pypdf>=5,<7", "python-multipart>=0.0.20", "fastembed>=0.6,<1", "langchain-text-splitters>=0.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "reportlab>=4,<5", "ruff>=0.11"]

[tool.setuptools.packages.find]
include = ["evidencedesk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
